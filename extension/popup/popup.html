<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Evoloz</title>

    <link rel="stylesheet" href="./popup.css">

</head>

<body>

    <div class="logo-container">
    <img src="../assets/logo2.png" id="logo">
</div>

    <div id="app">

        <!-- ===================================== -->
<!-- AUTH -->
<!-- ===================================== -->

<div id="authView" style="display:none;">

    <p>Sign in to Evoloz</p>

    <button id="googleLoginBtn">
        Continue with Google
    </button>

</div>

        <!-- ===================================== -->
        <!-- HOME -->
        <!-- ===================================== -->

        <div id="homeView" style="display:none;">

          <div id="statusCard" class="status-card">

<button
    id="upgradeBtn"
    class="upgrade-btn"
    style="display:none;"
>
    Upgrade to Pro
</button>

    <h3 id="planText">FREE</h3>

    <p id="evolveText">10 / 10 Evolves Remaining</p>

</div>

            <!-- <p>Never lose your AI work.</p> -->

            <p id="provider">🟢 Connected</p>

            <button id="captureBtn">
                EVOVLE
            </button>

            <button id="analyzeBtn">
                ANALYZE
            </button>

            <button id="settingsBtn">
                ⚙ AI Settings
            </button>

            <p id="status"></p>

        </div>

        <!-- ===================================== -->
        <!-- SETTINGS -->
        <!-- ===================================== -->

        <div id="settingsView" style="display:none;">

            <!-- <h2>AI Settings</h2> -->

            <p id = "BYOAI">
                Bring your own AI provider.
            </p>

            <label>

                Provider

                <select id="providerSelect">

                    <option value="openai">
                        OpenAI
                    </option>

                    <option value="claude">
                        Claude
                    </option>

                    <option value="gemini">
                        Gemini
                    </option>

                </select>

            </label>

            <label>

                Model

           <select id="modelSelect"></select>
            </label>

            <label>

                API Key

                <input
                    id="apiKeyInput"
                    type="password"
                    placeholder="Paste your API key">

            </label>

            <button id="saveSettingsBtn">

                SAVE

            </button>

            <button id="backBtn">

                ← BACK

            </button>
<p id="settingsStatus"></p>
            

        </div>

    </div>

    <!-- <footer>

        <small>v1.0.0</small>

    </footer> -->

    <script type="module" src="./popup.js"></script>

</body>

</html>
